<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" opacity="0.25">
  <defs>
    <radialGradient id="roundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#roundGlow)"/>

  <!-- Outer Ring Road -->
  <circle cx="400" cy="300" r="180" fill="none" stroke="#131B2E" stroke-width="90"/>
  <circle cx="400" cy="300" r="225" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
  <circle cx="400" cy="300" r="135" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>

  <!-- Dashed Circular Lane Divider -->
  <circle cx="400" cy="300" r="180" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="14, 18" opacity="0.4"/>

  <!-- Central Island with Greenery & Monument / Sign Outline -->
  <circle cx="400" cy="300" r="130" fill="#0C1527"/>
  <circle cx="400" cy="300" r="110" fill="#0E1C33"/>

  <!-- Rotating Traffic Direction Arrows (Circulação na Rotatória) -->
  <g fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <!-- Arrow 1 (top) -->
    <path d="M420,170 A180,180 0 0,0 360,174"/>
    <polygon points="350,178 365,168 362,185" fill="#60A5FA"/>

    <!-- Arrow 2 (bottom) -->
    <path d="M380,430 A180,180 0 0,0 440,426"/>
    <polygon points="450,422 435,432 438,415" fill="#60A5FA"/>
  </g>

  <!-- Approaching Inlets -->
  <rect x="0" y="275" width="220" height="50" fill="#131B2E" opacity="0.8"/>
  <rect x="580" y="275" width="220" height="50" fill="#131B2E" opacity="0.8"/>
  <rect x="375" y="0" width="50" height="120" fill="#131B2E" opacity="0.8"/>
  <rect x="375" y="480" width="50" height="120" fill="#131B2E" opacity="0.8"/>
</svg>

