<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" opacity="0.25">
  <defs>
    <radialGradient id="crossGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#crossGlow)"/>

  <!-- Isometric / Angled Intersection Grid -->
  <!-- Horizontal Road -->
  <rect x="0" y="240" width="800" height="120" fill="#131B2E" opacity="0.6"/>
  <!-- Vertical Road -->
  <rect x="340" y="0" width="120" height="600" fill="#131B2E" opacity="0.6"/>

  <!-- Pedestrian Crossings (Faixas de Pedestre) -->
  <!-- West -->
  <g fill="#94A3B8" opacity="0.35">
    <rect x="300" y="245" width="25" height="12" rx="2"/>
    <rect x="300" y="265" width="25" height="12" rx="2"/>
    <rect x="300" y="285" width="25" height="12" rx="2"/>
    <rect x="300" y="305" width="25" height="12" rx="2"/>
    <rect x="300" y="325" width="25" height="12" rx="2"/>
    <rect x="300" y="345" width="25" height="12" rx="2"/>
  </g>
  <!-- East -->
  <g fill="#94A3B8" opacity="0.35">
    <rect x="475" y="245" width="25" height="12" rx="2"/>
    <rect x="475" y="265" width="25" height="12" rx="2"/>
    <rect x="475" y="285" width="25" height="12" rx="2"/>
    <rect x="475" y="305" width="25" height="12" rx="2"/>
    <rect x="475" y="325" width="25" height="12" rx="2"/>
    <rect x="475" y="345" width="25" height="12" rx="2"/>
  </g>
  <!-- North -->
  <g fill="#94A3B8" opacity="0.35">
    <rect x="345" y="200" width="12" height="25" rx="2"/>
    <rect x="365" y="200" width="12" height="25" rx="2"/>
    <rect x="385" y="200" width="12" height="25" rx="2"/>
    <rect x="405" y="200" width="12" height="25" rx="2"/>
    <rect x="425" y="200" width="12" height="25" rx="2"/>
    <rect x="445" y="200" width="12" height="25" rx="2"/>
  </g>
  <!-- South -->
  <g fill="#94A3B8" opacity="0.35">
    <rect x="345" y="375" width="12" height="25" rx="2"/>
    <rect x="365" y="375" width="12" height="25" rx="2"/>
    <rect x="385" y="375" width="12" height="25" rx="2"/>
    <rect x="405" y="375" width="12" height="25" rx="2"/>
    <rect x="425" y="375" width="12" height="25" rx="2"/>
    <rect x="445" y="375" width="12" height="25" rx="2"/>
  </g>

  <!-- Yellow Center Dashes -->
  <g stroke="#F59E0B" stroke-width="3" stroke-dasharray="16, 16" opacity="0.4">
    <line x1="0" y1="300" x2="300" y2="300"/>
    <line x1="500" y1="300" x2="800" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="400" y1="400" x2="400" y2="600"/>
  </g>

  <!-- Subtle Traffic Light Glows -->
  <!-- Northwest corner -->
  <circle cx="320" cy="220" r="4" fill="#10B981" opacity="0.8"/>
  <circle cx="320" cy="220" r="14" fill="#10B981" opacity="0.15"/>
  <!-- Southeast corner -->
  <circle cx="480" cy="380" r="4" fill="#EF4444" opacity="0.8"/>
  <circle cx="480" cy="380" r="14" fill="#EF4444" opacity="0.15"/>
</svg>

