<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" opacity="0.35">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1329" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#111c3a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161f33" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f1624" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="lightBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Distant City Skyline Silhouettes -->
  <g fill="#131b2e" opacity="0.5">
    <rect x="30" y="220" width="45" height="180" rx="3"/>
    <rect x="85" y="190" width="60" height="210" rx="4"/>
    <rect x="155" y="240" width="40" height="160" rx="2"/>
    <rect x="205" y="170" width="70" height="230" rx="4"/>
    <rect x="285" y="210" width="50" height="190" rx="3"/>
    <rect x="345" y="160" width="80" height="240" rx="4"/>
    <polygon points="385,110 384,160 386,160" stroke="#3B82F6" stroke-width="2"/>
    <rect x="435" y="230" width="55" height="170" rx="3"/>
    <rect x="500" y="180" width="65" height="220" rx="4"/>
    <rect x="575" y="250" width="45" height="150" rx="2"/>
    <rect x="630" y="200" width="75" height="200" rx="4"/>
    <rect x="715" y="235" width="50" height="165" rx="3"/>
  </g>

  <!-- Glowing Building Windows -->
  <g fill="#60A5FA" opacity="0.25">
    <circle cx="100" cy="210" r="1.5"/><circle cx="120" cy="210" r="1.5"/>
    <circle cx="100" cy="230" r="1.5"/><circle cx="120" cy="230" r="1.5"/>
    <circle cx="225" cy="190" r="1.5"/><circle cx="245" cy="190" r="1.5"/>
    <circle cx="225" cy="215" r="1.5"/><circle cx="245" cy="215" r="1.5"/>
    <circle cx="365" cy="180" r="1.5"/><circle cx="395" cy="180" r="1.5"/>
    <circle cx="365" cy="210" r="1.5"/><circle cx="395" cy="210" r="1.5"/>
    <circle cx="520" cy="205" r="1.5"/><circle cx="545" cy="205" r="1.5"/>
    <circle cx="650" cy="225" r="1.5"/><circle cx="675" cy="225" r="1.5"/>
  </g>

  <!-- Horizon Line & Glowing Highway Overpass -->
  <path d="M0,380 Q400,350 800,380 L800,420 Q400,390 0,420 Z" fill="#18233c" opacity="0.6"/>
  <path d="M0,380 Q400,350 800,380" stroke="#3B82F6" stroke-width="2" opacity="0.4" fill="none"/>

  <!-- Perspective Highway (Asphalt) -->
  <polygon points="360,370 440,370 720,600 80,600" fill="url(#roadGrad)"/>

  <!-- Road Borders Neon Edge -->
  <line x1="360" y1="370" x2="80" y2="600" stroke="#2563EB" stroke-width="2.5" opacity="0.5"/>
  <line x1="440" y1="370" x2="720" y2="600" stroke="#2563EB" stroke-width="2.5" opacity="0.5"/>

  <!-- Dashed Center Line (Perspective) -->
  <g stroke="#FBBF24" stroke-linecap="round" opacity="0.6">
    <line x1="400" y1="375" x2="400" y2="390" stroke-width="1.5"/>
    <line x1="400" y1="405" x2="400" y2="425" stroke-width="2.5"/>
    <line x1="400" y1="445" x2="400" y2="475" stroke-width="4"/>
    <line x1="400" y1="500" x2="400" y2="540" stroke-width="5.5"/>
    <line x1="400" y1="565" x2="400" y2="615" stroke-width="7"/>
  </g>

  <!-- Light Streaks / Car Trails (Long exposure night effect) -->
  <!-- Red Taillights going forward -->
  <path d="M385,375 Q380,450 260,600" stroke="#EF4444" stroke-width="2.5" opacity="0.55" fill="none"/>
  <path d="M390,375 Q387,450 280,600" stroke="#F87171" stroke-width="1.5" opacity="0.4" fill="none"/>

  <!-- White/Cyan Headlights coming -->
  <path d="M415,375 Q420,450 540,600" stroke="#60A5FA" stroke-width="2.5" opacity="0.55" fill="none"/>
  <path d="M410,375 Q413,450 520,600" stroke="#93C5FD" stroke-width="1.5" opacity="0.4" fill="none"/>

  <!-- Ambient Light Halo -->
  <circle cx="400" cy="370" r="140" fill="url(#lightBeam)" opacity="0.3"/>
</svg>

