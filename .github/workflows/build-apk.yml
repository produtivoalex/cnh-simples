name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build TWA Android Project
        run: |
          mkdir -p android-build
          cd android-build
          
          # Use preinstalled Android SDK from runner
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          
          # Initialize TWA via Bubblewrap without interactive prompt
          bubblewrap init --manifest="https://cnhsimples.pages.dev/manifest.json" --directory="." --chromeOSOnly=false || true
          
          # Create a custom keystore for signing the APK
          keytool -genkey -v -keystore android.keystore -alias cnhsimples -keyalg RSA -keysize 2048 -validity 10000 -storepass cnhsimples123 -keypass cnhsimples123 -dname "CN=Alex, OU=CNH Simples, O=App, L=SP, S=SP, C=BR"
          
          # Build signed APK and bundle
          bubblewrap build --skipPwaValidation || true

      - name: Archive and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CNH-Simples-Release-APK
          path: android-build/**/*.apk
          if-no-files-found: warn
