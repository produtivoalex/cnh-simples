name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate and Build Android APK via Bubblewrap
        run: |
          mkdir twa-build
          cd twa-build
          
          # Initialize manifest
          bubblewrap init --manifest="https://cnhsimples.pages.dev/manifest.json" --directory="." --chromeOSOnly=false || true
          
          # Generate signing key if needed
          keytool -genkey -v -keystore android.keystore -alias cnhsimples -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Alex, OU=CNH Simples, O=App, L=SP, S=SP, C=BR"
          
          # Build APK
          bubblewrap build --skipPwaValidation || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CNH-Simples-APK
          path: twa-build/**/*.apk
          if-no-files-found: warn
