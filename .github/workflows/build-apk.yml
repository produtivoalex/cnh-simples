name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Project using Cordova
        run: |
          npm install -g cordova
          cordova create cnh-app dev.pages.cnhsimples "CNH Simples"
          cd cnh-app
          cordova platform add android
          
          # Replace www with our PWA static files
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          
          # Build APK
          cordova build android --debug

          mkdir -p ../dist
          find platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} ../dist/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CNH-Simples-APK
          path: dist/*.apk
          if-no-files-found: error
